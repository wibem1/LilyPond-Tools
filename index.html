<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LilyPond Tools 0.1.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><strong>LilyPond Tools</strong><span>0.1.0</span></div>
  <nav>
    <label class="button">Öffnen<input id="openFile" type="file" accept=".ly,.ily,text/plain" hidden></label>
    <button id="saveSource">Speichern</button>
    <button id="render">Noten erzeugen</button>
  </nav>
</header>
<main>
  <section class="source">
    <h2>LilyPond</h2>
    <textarea id="source" spellcheck="false">\version "2.24.0"

\header { title = "LilyPond Tools" }

\score {
  \relative c' { \key c \major \time 4/4 c4 d e f | g2 g | }
  \layout { }
  \midi { }
}</textarea>
  </section>
  <section class="preview">
    <div class="previewHead">
      <h2>Partitur</h2>
      <audio id="player" controls hidden></audio>
    </div>
    <div id="score" class="score">
      <p>Für V0.1 ist die Oberfläche vorbereitet. Der echte LilyPond-Renderer wird nach dem Rendering-Test angebunden.</p>
    </div>
    <pre id="status">Renderer: noch nicht verbunden</pre>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
